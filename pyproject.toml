[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "responseforge"
version = "0.1.0"
description = "SOAR incident contracts and policy with explicit replay and live modes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.3",
    "fastapi==0.164.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "mypy==1.20.2",
    "hatchling==1.33.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/responseforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/responseforge"]
plugins = ["pydantic.mypy"]
