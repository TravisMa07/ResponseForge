name: Offline qualification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.6"
          python-version: "3.12.12"
      - name: Install locked development environment
        run: uv sync --locked
      - name: Offline contracts, replay, source-derived transport and blocked-plan qualification
        run: make qualify
      - name: Build distributable without dependency resolution
        run: uv build --offline --no-build-isolation
